<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EKA PUTRA FC</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  margin:0;
  background:#f4f7fb;
}

/* HEADER */
header {
  position: sticky;
  top:0;
  z-index:100;
  background:#1e4e79;
  color:white;
  padding:15px;
  text-align:center;
}

header h2 { margin:5px; }
header p { margin:2px 0; font-size:13px; }

/* TOOLBAR */
.toolbar {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  padding:10px;
  background:white;
  position:sticky;
  top:80px;
  z-index:90;
  border-bottom:1px solid #ddd;
}

.nav-btn {
  background:#1e4e79;
  color:white;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
}

/* TABLE */
.table-wrapper {
  overflow-x:auto;
  background:white;
  border-radius:10px;
}

table {
  border-collapse:collapse;
  min-width:1500px;
}

th {
  background:#1e4e79;
  color:white;
  font-size:13px;
}

th, td {
  padding:12px;
  text-align:center;
  border:1px solid #ddd;
  font-size:13px;
}

/* FREEZE */
th:first-child, td:first-child {
  position: sticky;
  left: 0;
  background: white;
  z-index: 2;
}

th:first-child {
  background:#1e4e79;
  color:white;
}

/* SLOT */
.available { background:#e6f9ec; }
.booked {
  background:#ffe6e6;
  color:#dc3545;
  font-weight:bold;
}

/* 🔴 TANGGAL MERAH */
.minggu {
  color:red;
  font-weight:bold;
}

button {
  padding:6px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}

.btn-wa { background:#25D366; color:white; }
.btn-delete { background:#dc3545; color:white; }
.btn-confirm { background:#ffc107; }
</style>
</head>

<body>

<header>
  <h2>EKA PUTRA FC ⚽</h2>
  <p>Booking Lapangan Online</p>
  <p>Kp. Manggis Hilir RW 03, Desa Benda, Cicurug-Sukabumi</p>

  <a href="https://maps.app.goo.gl/akowsd4otisXjZAc7" target="_blank">
    <button style="margin-top:6px;background:#00b894;color:white;">
      📍 Lihat Lokasi
    </button>
  </a>
</header>

<div class="toolbar">
  <button class="nav-btn" onclick="prev()">⬅</button>
  <input type="date" id="filterTanggal">
  <button class="nav-btn" onclick="next()">➡</button>
</div>

<div class="table-wrapper">
<table>
<tbody id="jadwal"></tbody>
</table>
</div>

<script>

const adminPassword = "12345";
let isAdmin = false;

if(window.location.search.includes("admin")){
  let pass = prompt("Password admin:");
  if(pass === adminPassword){
    isAdmin = true;
  }
}

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "ekaputrafc-68823.firebaseapp.com",
  projectId: "ekaputrafc-68823"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const times = ["07:00-11:00","11:00-14:00","14:00-18:00"];
const jadwalEl = document.getElementById("jadwal");
const filterTanggal = document.getElementById("filterTanggal");

/* 🔴 LIST TANGGAL MERAH */
const tanggalMerah = [
  "2026-01-01",
  "2026-02-17",
  "2026-03-19",
  "2026-04-10",
  "2026-05-01",
  "2026-05-14",
  "2026-06-01",
  "2026-08-17",
  "2026-12-25"
];

function getDays(startDate){
  let days = [];
  let base = new Date(startDate);

  for(let i=0;i<30;i++){
    let d = new Date(base);
    d.setDate(base.getDate() + i);
    days.push(d.toISOString().split("T")[0]);
  }
  return days;
}

function loadData(){

let startDate = filterTanggal.value;
let days = getDays(startDate);

db.collection("bookings").onSnapshot(snapshot=>{

let html = "<tr><th>Jam</th>";

days.forEach(tanggal=>{
  let d = new Date(tanggal);

  let hari = d.toLocaleDateString("id-ID",{weekday:"long"});
  let tanggalFull = d.toLocaleDateString("id-ID");

  let isMinggu = d.getDay() === 0;
  let isLibur = tanggalMerah.includes(tanggal);
  let isRedDay = isMinggu || isLibur;

  html += `<th class="${isRedDay ? 'minggu' : ''}">
    ${hari}<br>${tanggalFull}
  </th>`;
});

html += "</tr>";

times.forEach(jam=>{
  html += `<tr><td>${jam}</td>`;

  days.forEach(tanggal=>{

    let found=null;

    snapshot.forEach(doc=>{
      let d=doc.data();
      if(d.jam===jam && d.tanggal===tanggal){
        found = {...d, id: doc.id};
      }
    });

    if(found){
      html += `<td class="booked">
        Booked
        <small>${found.nama}</small>
      </td>`;
    }else{
      html += `<td class="available">
        <a href="https://wa.me/6282262656042?text=Booking%20${tanggal}%20${jam}" target="_blank">
          <button class="btn-wa">Booking</button>
        </a>
      </td>`;
    }

  });

  html += "</tr>";
});

jadwalEl.innerHTML = html;

});
}

filterTanggal.value = new Date().toISOString().split("T")[0];
filterTanggal.addEventListener("change", loadData);

loadData();

function next(){
  let d = new Date(filterTanggal.value);
  d.setDate(d.getDate()+30);
  filterTanggal.value = d.toISOString().split("T")[0];
  loadData();
}

function prev(){
  let d = new Date(filterTanggal.value);
  d.setDate(d.getDate()-30);
  filterTanggal.value = d.toISOString().split("T")[0];
  loadData();
}

</script>

</body>
</html>
