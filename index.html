<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EKA PUTRA FC</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#f4f7fb;
}

/* HEADER */

header{
  background:#1e4e79;
  color:white;
  text-align:center;
  padding:20px 15px 15px;
  position:sticky;
  top:0;
  z-index:100;
}

header h2{
  margin:0;
  font-size:32px;
}

header p{
  margin:4px 0;
  font-size:14px;
}

/* TOOLBAR */

.toolbar{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  padding:8px;
  background:white;
  position:sticky;
  top:110px;
  z-index:99;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.nav-btn{
  background:#1e4e79;
  color:white;
  border:none;
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.nav-btn:hover{
  opacity:0.9;
}

/* TABLE */

.table-wrapper{
  overflow:auto;
  background:white;
}

table{
  border-collapse:collapse;
  width:100%;
  min-width:1500px;
}

th{
  background:#1e4e79;
  color:white;
  position:sticky;
  top:165px;
  z-index:5;
}

th, td{
  border:1px solid #ddd;
  padding:12px;
  text-align:center;
  min-width:120px;
}

/* freeze kolom jam */

th:first-child,
td:first-child{
  position:sticky;
  left:0;
  z-index:6;
  background:white;
  font-weight:bold;
}

th:first-child{
  background:#1e4e79;
  color:white;
}

/* WARNA */

.available{
  background:#e6f9ec;
}

.booked{
  background:#ffe6e6;
  color:#dc3545;
  font-weight:bold;
}

.minggu{
  color:#ffdddd;
}

/* BUTTON */

button{
  border:none;
  padding:7px 12px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}

.btn-wa{
  background:#25D366;
  color:white;
}

.btn-confirm{
  background:#ffc107;
}

.btn-delete{
  background:#dc3545;
  color:white;
}

small{
  display:block;
  margin:5px 0;
  color:#333;
}

/* MOBILE */

@media(max-width:768px){

  header h2{
    font-size:24px;
  }

  header p{
    font-size:12px;
  }

  .toolbar{
    top:98px;
  }

  th{
    top:150px;
  }

}

</style>
</head>

<body>

<header>

  <h2>EKA PUTRA FC ⚽</h2>

  <p>Booking Lapangan Online</p>

  <p>
    Kp. Manggis Hilir RW 03,
    Desa Benda,
    Cicurug-Sukabumi
  </p>

  <a href="https://maps.app.goo.gl/akowsd4otisXjZAc7" target="_blank">

    <button style="background:#00b894;color:white;margin-top:8px;">
      📍 Lihat Lokasi
    </button>

  </a>

</header>

<div class="toolbar">

  <button class="nav-btn" onclick="prev()">⬅</button>

  <input type="date" id="filterTanggal">

  <button class="nav-btn" onclick="next()">➡</button>

</div>

<div class="table-wrapper">

  <table>

    <thead id="thead"></thead>

    <tbody id="jadwal"></tbody>

  </table>

</div>

<script>

/* =========================
   ADMIN
========================= */

const adminPassword = "12345";
let isAdmin = false;

if(window.location.search.includes("admin")){

  let pass = prompt("Password admin:");

  if(pass === adminPassword){
    isAdmin = true;
  }

}

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey: "AIzaSyCcdLLQ2u1ggm58Se30DSqXqUhfYR1ZnjE",

  authDomain: "ekaputrafc-68823.firebaseapp.com",

  projectId: "ekaputrafc-68823"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

/* =========================
   DATA
========================= */

const times = [
  "07:00-11:00",
  "11:00-14:00",
  "14:00-18:00"
];

const jadwalEl = document.getElementById("jadwal");

const filterTanggal = document.getElementById("filterTanggal");

/* =========================
   TANGGAL MERAH
========================= */

const tanggalIslam = [

  "2026-01-17",
  "2026-03-20",
  "2026-03-21",
  "2026-05-27",
  "2026-06-16",
  "2026-08-26"

];

let tanggalMerah = [];

async function loadTanggalMerah(){

  try{

    let res = await fetch(
      "https://date.nager.at/api/v3/PublicHolidays/2026/ID"
    );

    let data = await res.json();

    let apiDates = data.map(item => item.date);

    tanggalMerah = [
      ...new Set([...apiDates, ...tanggalIslam])
    ];

  }catch(e){

    console.log("Gagal ambil API");

    tanggalMerah = tanggalIslam;

  }

}

/* =========================
   FORMAT TANGGAL
========================= */

function formatTanggal(date){

  let year = date.getFullYear();

  let month = String(
    date.getMonth() + 1
  ).padStart(2,'0');

  let day = String(
    date.getDate()
  ).padStart(2,'0');

  return `${year}-${month}-${day}`;

}

/* =========================
   30 HARI
========================= */

function getDays(startDate){

  let days = [];

  let base = new Date(startDate);

  for(let i=0;i<30;i++){

    let d = new Date(base);

    d.setDate(base.getDate()+i);

    days.push(formatTanggal(d));

  }

  return days;

}

/* =========================
   LOAD DATA
========================= */

let unsubscribe = null;

function loadData(){

  let startDate = filterTanggal.value;

  let days = getDays(startDate);

  if(unsubscribe){
    unsubscribe();
  }

  unsubscribe = db
  .collection("bookings")
  .onSnapshot(snapshot=>{

    /* HEADER */

    let headHtml = `
      <tr>
        <th>Jam</th>
    `;

    days.forEach(tanggal=>{

      let d = new Date(tanggal);

      let hari = d.toLocaleDateString(
        "id-ID",
        {weekday:"long"}
      );

      let tanggalFull = d.toLocaleDateString("id-ID");

      let isMinggu = d.getDay() === 0;

      let isLibur = tanggalMerah.includes(tanggal);

      let isRedDay = isMinggu || isLibur;

      headHtml += `
        <th class="${isRedDay ? 'minggu' : ''}">
          ${hari}<br>
          ${tanggalFull}
        </th>
      `;

    });

    headHtml += "</tr>";

    document
    .getElementById("thead")
    .innerHTML = headHtml;

    /* BODY */

    let bodyHtml = "";

    times.forEach(jam=>{

      bodyHtml += `
        <tr>
          <td>${jam}</td>
      `;

      days.forEach(tanggal=>{

        let found = null;

        snapshot.forEach(doc=>{

          let d = doc.data();

          if(
            d.jam === jam &&
            d.tanggal === tanggal
          ){

            found = {
              ...d,
              id:doc.id
            };

          }

        });

        if(found){

          bodyHtml += `
          <td class="booked">

            Booked

            <small>${found.nama}</small>

            ${isAdmin
              ? `
              <button
                class="btn-delete"
                onclick="hapus('${found.id}')"
              >
                Hapus
              </button>
              `
              : ''
            }

          </td>
          `;

        }else{

          bodyHtml += `
          <td class="available">

            ${isAdmin

              ? `
              <button
                class="btn-confirm"
                onclick="quickBooking('${jam}','${tanggal}')"
              >
                Konfirmasi
              </button>
              `

              : `
              <a
                href="https://wa.me/6282262656042?text=Booking%20${tanggal}%20${jam}"
                target="_blank"
              >

                <button class="btn-wa">
                  Booking
                </button>

              </a>
              `
            }

          </td>
          `;

        }

      });

      bodyHtml += "</tr>";

    });

    jadwalEl.innerHTML = bodyHtml;

  });

}

/* =========================
   NAVIGASI
========================= */

function next(){

  let d = new Date(filterTanggal.value);

  d.setDate(d.getDate()+30);

  filterTanggal.value = formatTanggal(d);

  loadData();

}

function prev(){

  let d = new Date(filterTanggal.value);

  d.setDate(d.getDate()-30);

  filterTanggal.value = formatTanggal(d);

  loadData();

}

filterTanggal.addEventListener(
  "change",
  loadData
);

/* =========================
   CRUD
========================= */

function quickBooking(jam,tanggal){

  let nama = prompt("Nama tim?");

  if(!nama) return;

  db.collection("bookings").add({

    nama,
    tanggal,
    jam

  });

}

function hapus(id){

  if(confirm("Hapus booking?")){

    db.collection("bookings")
    .doc(id)
    .delete();

  }

}

/* =========================
   INIT
========================= */

filterTanggal.value = formatTanggal(
  new Date()
);

async function init(){

  await loadTanggalMerah();

  loadData();

}

init();

</script>

</body>
</html>
