<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EKA PUTRA FC</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  margin:0;
  background:#f4f7fb;
}

header {
  position: sticky;
  top:0;
  z-index:100;
  background:#1e4e79;
  color:white;
  padding:15px;
  text-align:center;
}

header h2 { margin:5px; }
header p { margin:2px 0; font-size:13px; }

.toolbar {
  display:flex;
  justify-content:center;
  gap:10px;
  padding:10px;
  background:white;
  position:sticky;
  top:80px;
  z-index:90;
}

.nav-btn {
  background:#1e4e79;
  color:white;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
}

.table-wrapper {
  overflow-x:auto;
  background:white;
}

table {
  border-collapse:collapse;
  min-width:1500px;
}

th {
  background:#1e4e79;
  color:white;
}

th, td {
  padding:12px;
  text-align:center;
  border:1px solid #ddd;
}

/* freeze kolom jam */
th:first-child, td:first-child {
  position: sticky;
  left: 0;
  background: white;
  z-index: 2;
}

th:first-child {
  background:#1e4e79;
  color:white;
}

/* warna */
.available { background:#e6f9ec; }
.booked {
  background:#ffe6e6;
  color:#dc3545;
  font-weight:bold;
}

.minggu {
  color:red;
  font-weight:bold;
}

button {
  padding:6px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}

.btn-wa { background:#25D366; color:white; }
.btn-confirm { background:#ffc107; }
.btn-delete { background:#dc3545; color:white; }

</style>
</head>

<body>

<header>
  <h2>EKA PUTRA FC ⚽</h2>
  <p>Booking Lapangan Online</p>
  <p>Kp. Manggis Hilir RW 03, Desa Benda, Sukabumi</p>

  <a href="https://maps.app.goo.gl/akowsd4otisXjZAc7" target="_blank">
    <button style="margin-top:6px;background:#00b894;color:white;">
      📍 Lihat Lokasi
    </button>
  </a>
</header>

<div class="toolbar">
  <button class="nav-btn" onclick="prev()">⬅</button>
  <input type="date" id="filterTanggal">
  <button class="nav-btn" onclick="next()">➡</button>
</div>

<div class="table-wrapper">
<table>
<tbody id="jadwal"></tbody>
</table>
</div>

<script>

const adminPassword = "12345";
let isAdmin = false;

if(window.location.search.includes("admin")){
  let pass = prompt("Password admin:");
  if(pass === adminPassword){
    isAdmin = true;
  }
}

const firebaseConfig = {
  apiKey: "AIzaSyCcdLLQ2u1ggm58Se30DSqXqUhfYR1ZnjE",
  authDomain: "ekaputrafc-68823.firebaseapp.com",
  projectId: "ekaputrafc-68823"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const times = ["07:00-11:00","11:00-14:00","14:00-18:00"];
const jadwalEl = document.getElementById("jadwal");
const filterTanggal = document.getElementById("filterTanggal");

/* 🔴 HARI BESAR ISLAM */
const tanggalIslam = [
  "2026-01-17",
  "2026-03-20",
  "2026-03-21",
  "2026-05-27",
  "2026-06-16",
  "2026-08-26"
];

let tanggalMerah = [];

/* 🔴 AMBIL API + GABUNG */
async function loadTanggalMerah(){
  try{
    let res = await fetch("https://date.nager.at/api/v3/PublicHolidays/2026/ID");
    let data = await res.json();

    let apiDates = data.map(item => item.date);

    // gabungkan API + Islam
    tanggalMerah = [...new Set([...apiDates, ...tanggalIslam])];

  }catch(e){
    console.log("Gagal ambil API, pakai fallback Islam saja");
    tanggalMerah = tanggalIslam;
  }
}

/* 30 hari */
function getDays(startDate){
  let days = [];
  let base = new Date(startDate);

  for(let i=0;i<30;i++){
    let d = new Date(base);
    d.setDate(base.getDate() + i);
    days.push(d.toISOString().split("T")[0]);
  }
  return days;
}

function loadData(){

let startDate = filterTanggal.value;
let days = getDays(startDate);

db.collection("bookings").onSnapshot(snapshot=>{

let html = "<tr><th>Jam</th>";

days.forEach(tanggal=>{
  let d = new Date(tanggal);

  let hari = d.toLocaleDateString("id-ID",{weekday:"long"});
  let tanggalFull = d.toLocaleDateString("id-ID");

  let isMinggu = d.getDay() === 0;
  let isLibur = tanggalMerah.includes(tanggal);
  let isRedDay = isMinggu || isLibur;

  html += `<th class="${isRedDay ? 'minggu' : ''}">
    ${hari}<br>${tanggalFull}
  </th>`;
});

html += "</tr>";

times.forEach(jam=>{
  html += `<tr><td>${jam}</td>`;

  days.forEach(tanggal=>{

    let found=null;

    snapshot.forEach(doc=>{
      let d=doc.data();
      if(d.jam===jam && d.tanggal===tanggal){
        found = {...d, id: doc.id};
      }
    });

    if(found){
      html += `<td class="booked">
        Booked
        <small>${found.nama}</small>
        ${isAdmin ? `<button class="btn-delete" onclick="hapus('${found.id}')">Hapus</button>` : ''}
      </td>`;
    }else{
      html += `<td class="available">
        ${isAdmin 
          ? `<button class="btn-confirm" onclick="quickBooking('${jam}','${tanggal}')">Konfirmasi</button>`
          : `<a href="https://wa.me/6282262656042?text=Booking%20${tanggal}%20${jam}" target="_blank">
             <button class="btn-wa">Booking</button></a>`
        }
      </td>`;
    }

  });

  html += "</tr>";
});

jadwalEl.innerHTML = html;

});
}

/* INIT */
filterTanggal.value = new Date().toISOString().split("T")[0];

async function init(){
  await loadTanggalMerah();
  loadData();
}
init();

/* NAV */
function next(){
  let d = new Date(filterTanggal.value);
  d.setDate(d.getDate()+30);
  filterTanggal.value = d.toISOString().split("T")[0];
  loadData();
}

function prev(){
  let d = new Date(filterTanggal.value);
  d.setDate(d.getDate()-30);
  filterTanggal.value = d.toISOString().split("T")[0];
  loadData();
}

filterTanggal.addEventListener("change", loadData);

/* CRUD */
function quickBooking(jam, tanggal){
  let nama = prompt("Nama tim?");
  if(!nama) return;
  db.collection("bookings").add({nama,tanggal,jam});
}

function hapus(id){
  db.collection("bookings").doc(id).delete();
}

</script>

</body>
</html>
